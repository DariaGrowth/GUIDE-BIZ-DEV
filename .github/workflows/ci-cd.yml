name: ING Growth AI – CI/CD Pipeline (Simplified)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  # ─── STAGE 1 : Validation basique ───────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Python syntax
        run: python -m py_compile streamlit_app.py
      
      - name: Success message
        run: echo "✅ Validation réussie ! Le code est prêt."

  # ─── STAGE 2 : Notification de déploiement ───────────
  deploy-notification:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify deployment
        run: |
          echo "🚀 Déploiement automatique vers Streamlit Cloud en cours..."
          echo "L'application sera mise à jour dans quelques minutes."
