name: ING Growth AI – CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  # ─── STAGE 1 : CI ───────────────────
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install ruff black bandit pytest pytest-mock openpyxl
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Black)
        run: black --check .

      - name: Security scan (Bandit)
        run: bandit -r . -ll

  # ─── STAGE 2 : TESTS ─────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint-and-security
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_STAGING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt && pip install pytest pytest-mock

      - name: Run unit & integration tests
        run: pytest tests/ -v --tb=short

  # ─── STAGE 3 : CD (Staging) ───────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Streamlit Cloud (staging)
        run: echo "Déploiement staging déclenché via push sur staging"

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://your-app-staging.streamlit.io || exit 1

  # ─── STAGE 4 : PROD (Manual Gate) ────
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-app.streamlit.io
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Streamlit Cloud (prod)
        run: echo "Déploiement prod déclenché via push sur main"

      - name: Smoke test production
        run: |
          sleep 30
          curl -f https://your-app.streamlit.io || exit 1
